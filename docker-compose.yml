# =============================================================================
# OK Footwear ERP — Docker Compose (Development)
# =============================================================================
# Six services: PostgreSQL 16, Redis 7, MinIO, PgBouncer, NestJS, Nginx
#
# Quick start:
#   1. cp .env.local.example .env.local   # Create env file
#   2. docker compose up -d               # Start all services
#   3. docker compose ps                  # Verify all 6 are healthy
#   4. curl http://localhost/api/v1/health
#
# Stopping:
#   docker compose down                   # Stop + remove containers
#   docker compose down -v                # Also remove named volumes
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 — Primary database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: ok-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ok_footwear
      POSTGRES_PASSWORD: ok_footwear_dev
      POSTGRES_DB: ok_footwear_erp

    ports:
      - '5433:5432'

    volumes:
      - pg_data:/var/lib/postgresql/data

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ok_footwear -d ok_footwear_erp']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - ok-network

  # ---------------------------------------------------------------------------
  # Redis 7 — Cache, queues, auth tokens
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ok-redis
    restart: unless-stopped

    ports:
      # Host:7379 → Container:6379 (non-standard host port to avoid conflicts)
      - '7379:6379'

    volumes:
      - redis_data:/data

    # Persistence: RDB snapshot every 60s if ≥1 key changed
    command: redis-server --save 60 1 --loglevel warning

    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    networks:
      - ok-network

  # ---------------------------------------------------------------------------
  # MinIO — S3-compatible object storage (dev equivalent of AWS S3)
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: ok-minio
    restart: unless-stopped

    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

    ports:
      - '9000:9000'   # S3 API
      - '9001:9001'   # Web Console (http://localhost:9001)

    volumes:
      - minio_data:/data

    command: server /data --console-address ":9001"

    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:9000/minio/health/live']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

    networks:
      - ok-network

  # ---------------------------------------------------------------------------
  # PgBouncer — Connection pooler (transaction mode, required for Prisma)
  # ---------------------------------------------------------------------------
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: ok-pgbouncer
    restart: unless-stopped

    environment:
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_NAME: ok_footwear_erp
      DB_USER: ok_footwear
      DB_PASSWORD: ok_footwear_dev

      # Auth: PostgreSQL 16 defaults to scram-sha-256
      AUTH_TYPE: scram-sha-256
      AUTH_USER: ok_footwear

      # Listen port must match the container port in 'ports' mapping
      LISTEN_PORT: '6432'

      # Pool configuration
      POOL_MODE: transaction
      MAX_CLIENT_CONN: '20'
      DEFAULT_POOL_SIZE: '20'

      # Admin user for PgBouncer stats
      ADMIN_USERS: ok_footwear

    ports:
      - '6432:6432'

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ok_footwear -d ok_footwear_erp -h localhost -p 6432']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - ok-network

  # ---------------------------------------------------------------------------
  # NestJS — OK Footwear ERP backend (built from local Dockerfile)
  # On start: scripts/docker-entrypoint.sh runs prisma migrate deploy via
  # DIRECT_DATABASE_URL (postgres:5432) before node dist/main.
  # ---------------------------------------------------------------------------
  nestjs:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: ok-nestjs
    restart: unless-stopped

    env_file:
      - .env.local

    ports:
      - '7100:7100'

    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:7100/api/v1/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    networks:
      - ok-network

  # ---------------------------------------------------------------------------
  # Nginx — Reverse proxy (front door for all HTTP traffic)
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: ok-nginx
    restart: unless-stopped

    ports:
      - '80:80'

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      nestjs:
        condition: service_healthy

    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:80/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    networks:
      - ok-network

# =============================================================================
# Named volumes — survive docker compose down
# =============================================================================
volumes:
  pg_data:
    name: ok_pg_data
  redis_data:
    name: ok_redis_data
  minio_data:
    name: ok_minio_data

# =============================================================================
# Shared network — all services communicate over this bridge
# =============================================================================
networks:
  ok-network:
    name: ok_network
    driver: bridge
