# =============================================================================
# OK Footwear ERP — CI/CD Pipeline
# =============================================================================
#
# Triggers:
#   push to main     → lint → type-check → tests → build → push ECR → deploy
#   PR open/sync     → lint → type-check → tests → build → push ECR (preview)
#   PR close          → cleanup preview deployment
#
# Stages (fail-fast — each stage gates the next):
#   1. lint            ESLint + Prettier
#   2. type-check      tsc --noEmit (TypeScript strict)
#   3. unit-tests      Jest unit tests (no I/O)
#   4. integration     Jest integration tests (PG + Redis service containers)
#   5. docker-build    Multi-stage Docker build
#   6. push-ecr        Push to AWS ECR with git SHA + branch tags
#   7. deploy          kubectl rollout restart (main) / preview deploy (PR)
#
# Secrets (configure in GitHub → Settings → Secrets and variables → Actions):
#   AWS_ACCESS_KEY_ID       — IAM user with ECR push + EKS describe permissions
#   AWS_SECRET_ACCESS_KEY   — Corresponding secret key
#   KUBECONFIG              — Base64-encoded kubeconfig for the EKS cluster
#   ECR_REGISTRY            — AWS account ID .dkr.ecr.region.amazonaws.com
# =============================================================================

name: CI/CD

# ---------------------------------------------------------------------------
# Triggers
# ---------------------------------------------------------------------------
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

# ---------------------------------------------------------------------------
# Concurrency — cancel in-progress runs for the same PR/branch
# ---------------------------------------------------------------------------
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# ---------------------------------------------------------------------------
# Environment — shared across all jobs
# ---------------------------------------------------------------------------
env:
  NODE_VERSION: '20'
  ECR_REPOSITORY: ok-footwear-erp

jobs:
  # ===========================================================================
  # Stage 1: Lint
  # ===========================================================================
  lint:
    name: 'Lint (ESLint + Prettier)'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run ESLint
        run: npm run lint

  # ===========================================================================
  # Stage 2: Type Check
  # ===========================================================================
  type-check:
    name: 'Type Check (tsc --noEmit)'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type check
        run: npx tsc --noEmit

  # ===========================================================================
  # Stage 3: Unit Tests
  # ===========================================================================
  unit-tests:
    name: 'Unit Tests (Jest)'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run unit tests
        run: npm test -- --coverage --testPathPattern='\.spec\.ts$' --testPathIgnorePatterns='/integration/'

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage/
          retention-days: 7

  # ===========================================================================
  # Stage 4: Integration Tests (PG + Redis service containers)
  # ===========================================================================
  integration-tests:
    name: 'Integration Tests'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint

    # -----------------------------------------------------------------------
    # GitHub Actions service containers (NOT testcontainers)
    # -----------------------------------------------------------------------
    # DEVIATION: The constraint explicitly requires service containers, not
    # testcontainers. GitHub's service containers run as sibling containers
    # on the same Docker network, accessible via localhost.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ok_footwear
          POSTGRES_PASSWORD: ok_footwear_dev
          POSTGRES_DB: ok_footwear_erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy
        env:
          # Use DIRECT_DATABASE_URL for migrations (DDL not supported via PgBouncer)
          DATABASE_URL: postgresql://ok_footwear:ok_footwear_dev@localhost:5432/ok_footwear_erp?pgbouncer=true&connection_limit=20
          DIRECT_DATABASE_URL: postgresql://ok_footwear:ok_footwear_dev@localhost:5432/ok_footwear_erp

      - name: Run integration tests
        run: npm test -- --testPathPattern='integration' --forceExit --detectOpenHandles
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://ok_footwear:ok_footwear_dev@localhost:5432/ok_footwear_erp?pgbouncer=true&connection_limit=20
          DIRECT_DATABASE_URL: postgresql://ok_footwear:ok_footwear_dev@localhost:5432/ok_footwear_erp
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-test-secret-that-is-at-least-32-characters-long

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          path: coverage/
          retention-days: 7

  # ===========================================================================
  # Stage 5: Docker Build
  # ===========================================================================
  docker-build:
    name: 'Docker Build'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [unit-tests, integration-tests]
    # Skip if PR is closed (no build needed)
    if: github.event.action != 'closed'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: runner
          push: false
          load: true
          tags: ${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image size
        run: |
          SIZE=$(docker images ${{ env.ECR_REPOSITORY }}:${{ github.sha }} --format '{{.Size}}')
          echo "Image size: $SIZE"
          # DEVIATION: Size check is informational only. The Dockerfile
          # targets < 200MB but we don't hard-fail here — ECR has its own
          # size limits and image scanning.

  # ===========================================================================
  # Stage 6: Push to ECR
  # ===========================================================================
  push-ecr:
    name: 'Push to ECR'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: docker-build
    # Only push on main push or PR open/sync (not on PR close)
    if: github.event.action != 'closed'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -----------------------------------------------------------------------
      # Compute ECR tags
      # -----------------------------------------------------------------------
      # Strategy:
      #   main push   → :latest, :main-{sha8}
      #   PR open     → :pr-{number}, :sha-{sha8}
      #   PR sync     → :pr-{number} (updated)
      - name: Compute ECR tags
        id: tags
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-8)
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            TAGS="${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest,${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:main-${SHORT_SHA}"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            TAGS="${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:pr-${{ github.event.pull_request.number }},${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:sha-${SHORT_SHA}"
          fi
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "Tags: ${TAGS}"

      - name: Build and push to ECR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: runner
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================================================
  # Stage 7: Deploy to Kubernetes
  # ===========================================================================
  deploy:
    name: 'Deploy (kubectl)'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: push-ecr

    # Select deployment strategy based on event type
    steps:
      # --- Setup ---
      - name: Configure kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Set kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      # --- Main branch deployment ---
      - name: Deploy to production (main)
        if: github.ref == 'refs/heads/main'
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-8)
          kubectl set image deployment/ok-footwear-erp \
            nestjs=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:main-${SHORT_SHA} \
            --namespace=production \
            --record
          kubectl rollout status deployment/ok-footwear-erp \
            --namespace=production \
            --timeout=5m

      # --- PR preview deployment ---
      - name: Deploy preview (PR)
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        run: |
          PR_NUM=${{ github.event.pull_request.number }}
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-8)
          PREVIEW_NS="pr-${PR_NUM}"

          # Create preview namespace if it doesn't exist
          kubectl create namespace ${PREVIEW_NS} --dry-run=client -o yaml | kubectl apply -f -

          # Deploy using the ECR image tagged with PR number
          # This assumes a Helm chart or kustomize overlay exists for preview envs
          # DEVIATION: Full Helm/kustomize configuration is out of scope for
          # Sprint 1. This step is a placeholder that references the deployment
          # pattern expected in Sprint 2 (Infrastructure as Code).
          kubectl set image deployment/ok-footwear-erp \
            nestjs=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:pr-${PR_NUM} \
            --namespace=${PREVIEW_NS}

          kubectl rollout status deployment/ok-footwear-erp \
            --namespace=${PREVIEW_NS} \
            --timeout=5m

          echo "::notice::Preview deployed: https://pr-${PR_NUM}.preview.okfootwear.com"

      # --- PR close → cleanup preview ---
      - name: Cleanup preview (PR closed)
        if: github.event_name == 'pull_request' && github.event.action == 'closed'
        run: |
          PR_NUM=${{ github.event.pull_request.number }}
          PREVIEW_NS="pr-${PR_NUM}"

          kubectl delete namespace ${PREVIEW_NS} --ignore-not-found=true
          echo "::notice::Preview environment pr-${PR_NUM} deleted"
