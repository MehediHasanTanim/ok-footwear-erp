# =============================================================================
# Nginx Reverse Proxy — OK Footwear ERP
# =============================================================================
# Proxies all traffic to the NestJS backend on port 7100.
# Nginx handles request buffering, header forwarding, and timeout management.
#
# For production, add:
#   - SSL/TLS termination (listen 443 ssl)
#   - gzip compression
#   - Rate limiting at the nginx layer
#   - Real IP forwarding from load balancer

upstream nestjs_backend {
    # Docker DNS resolves "nestjs" to the container IP
    server nestjs:7100;
}

server {
    listen 80;
    server_name _;

    # Maximum request body size (for file uploads to S3)
    client_max_body_size 50M;

    # Proxy timeouts — generous for long-running API calls (reports, exports)
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_connect_timeout 10s;

    # -----------------------------------------------------------------------
    # Health check — used by Docker HEALTHCHECK and load balancers
    # -----------------------------------------------------------------------
    location /health {
        proxy_pass http://nestjs_backend/api/v1/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # -----------------------------------------------------------------------
    # API — all requests proxied to NestJS
    # -----------------------------------------------------------------------
    location / {
        proxy_pass http://nestjs_backend;
        proxy_http_version 1.1;

        # WebSocket support (for potential future SSE/WS connections)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forward original request info
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Forward correlation ID (if present in incoming request)
        proxy_set_header X-Correlation-ID $http_x_correlation_id;

        # Hide backend headers from client
        proxy_hide_header X-Powered-By;
    }
}
