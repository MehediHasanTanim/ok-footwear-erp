<!-- HTTP Pipeline -->
<g class="node c-blue" data-tip="HTTP Pipeline: Every request passes through — (1) JWT Guard: validates Bearer token, extracts user+roles; (2) RBAC Guard: checks module+action permission; (3) Rate-limit Guard: enforces per-user limits via Redis; (4) Validation Pipe: class-validator DTOs; (5) Controller: routes to service; (6) Response Interceptor: wraps response in {data, meta}; (7) Exception Filter: maps errors to RFC 7807 problem+json.">
  <rect x="36" y="162" width="748" height="30" rx="6" stroke-width="0.6"/>
  <text class="th" x="410" y="177" text-anchor="middle" dominant-baseline="central">JWT Guard → RBAC Guard → Rate-limit Guard → Validation Pipe → Controller → Response Interceptor → Exception Filter</text>
</g>

<script>
const tip = document.getElementById('tooltip');
document.querySelectorAll('.node[data-tip]').forEach(el => {
  el.addEventListener('mouseenter', e => {
    tip.textContent = el.dataset.tip;
    tip.style.display = 'block';
  });
  el.addEventListener('mousemove', e => {
    tip.style.left = (e.clientX + 14) + 'px';
    tip.style.top  = (e.clientY - 8)  + 'px';
  });
  el.addEventListener('mouseleave', () => {
    tip.style.display = 'none';
  });
});
</script>
